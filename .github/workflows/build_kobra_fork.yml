name: Build Kobra X fork (Windows and Linux)

on:
  push:
    branches:
      - kobra-x-purge-v2.5.1

concurrency:
  group: build-kobra-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_linux:
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
      arch: ''
    secrets: inherit
  build_windows:
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
    secrets: inherit
